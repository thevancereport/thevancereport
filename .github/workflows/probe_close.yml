name: Close-time probe

# Temporary. It answers one question: how soon after the 4 p.m. Eastern bell
# does Nasdaq's quote actually carry the day's close, for a real sample of the
# universe rather than for a handful of mega-caps?
#
# The nightly screen waits for Nasdaq to mark the market Closed, which is 8
# p.m. Eastern, so the screen cannot go up before about 8:30 even now that the
# price cache has taken the run itself down to minutes. People read this in
# the evening; a list that lands at bedtime is a list for tomorrow.
#
# Relaxing that guard means trusting the quote's own last-trade stamp, and
# nobody has seen what that stamp looks like while the market is open -- at
# 11 p.m. it is a bare "Sep 22, 2026" with no time on it. Guessing is how the
# 21 Sep 2026 bug happened, where Friday's prices went out under Monday's
# date. So: measure first, then write the rule.
#
# Delete this workflow and scripts/probe_close.py once the schedule is settled.

on:
  schedule:
    # 4:05, 4:35, 5:30, 6:30 and 7:30 p.m. Eastern, Monday to Friday.
    - cron: '5 20 * * 1-5'
    - cron: '35 20 * * 1-5'
    - cron: '30 21 * * 1-5'
    - cron: '30 22 * * 1-5'
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
    inputs:
      sample:
        description: "How many symbols to sample"
        default: "400"

permissions:
  contents: read

concurrency:
  group: close-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ask Nasdaq what it has
        working-directory: scripts
        env:
          SCREEN_FILE: ${{ github.workspace }}/value_screen.json
          PROBE_N: ${{ inputs.sample || '400' }}
        run: python probe_close.py | tee -a "$GITHUB_STEP_SUMMARY"

name: LEAPS screen

# Manual re-run of the LEAPS screen. The nightly run happens inside
# "Track record" (track_record.yml), so the site deploys once a night; use
# this only if that step failed or to refresh the quotes by hand.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-record
  cancel-in-progress: false

jobs:
  leaps:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test
        working-directory: scripts
        run: python test_leaps_screen.py

      - name: Run the LEAPS screen
        run: python3 scripts/leaps_screen.py

      - name: Commit
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- leaps_screen.json leaps_iv_history.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "LEAPS screen (manual run)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error::couldn't push after three tries"; exit 1

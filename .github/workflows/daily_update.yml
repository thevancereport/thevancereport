name: Daily Financial Data Sync

# PAUSED 20 September 2026. This job runs scripts/update_research.py, the
# retired cash-plus-drop screen, and commits research.json and
# screen_snapshot.json. No page on the site reads either file any more --
# every page reads value_screen.json, written by value_daily.yml -- so the
# schedule was spending an FMP quota every weekday to produce files nobody
# sees. It also triggered the daily briefing video, paused the same night.
# Kept runnable by hand from the Actions tab.
#
# To restore:  put these two lines back under "on:"
#   schedule:
#     - cron: '0 21 * * 1-5'
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Update Script
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/update_research.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update research.json metrics [skip ci]"
          file_pattern: "research.json screen_snapshot.json"

name: Backfill a video

# Makes the top-five video for an earlier night, from the screen file exactly
# as it stood on that night, uploads it and adds it to that night's note.
# It leaves daily_video.json and the home-page box (top5.json) alone, so
# tonight's automatic video is not affected. Run it by hand from the Actions
# tab and give the date, e.g. 2026-09-28. Don't run it between 7 PM and the
# moment the night's screen publishes.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Screen date to make the video for (YYYY-MM-DD)"
        required: true
        type: string
      privacy:
        description: "YouTube privacy"
        type: choice
        default: public
        options: [public, unlisted, private]

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find that night's screen
        env:
          DAY: ${{ inputs.date }}
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          day = os.environ["DAY"].strip()
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", day):
              sys.exit(f"'{day}' is not a date like 2026-09-28")
          if not os.path.exists(f"top-five-{day}.html"):
              sys.exit(f"there is no note top-five-{day}.html to add the video to")
          commits = subprocess.run(["git", "log", "--format=%H", "--", "value_screen.json"],
                                   capture_output=True, text=True, check=True).stdout.split()
          for c in commits:  # newest first: the last version written for that date
              try:
                  vs = subprocess.run(["git", "show", f"{c}:value_screen.json"], capture_output=True, text=True, check=True).stdout
                  if json.loads(vs)["_meta"]["as_of"] == day:
                      break
              except Exception:
                  continue
          else:
              sys.exit(f"no version of value_screen.json is for {day}")
          os.makedirs("snap", exist_ok=True)
          open("snap/value_screen.json", "w").write(vs)
          h = subprocess.run(["git", "show", f"{c}:screen_history.json"], capture_output=True, text=True)
          if h.returncode == 0:
              open("snap/screen_history.json", "w").write(h.stdout)
          print(f"using value_screen.json from {c[:7]} for {day}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"Screen for {day} taken from commit {c[:7]}.\n")
          PY
          # company names as the notes spell them
          cp top-five-*.html snap/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg, fonts and the voice
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet pillow numpy requests piper-tts
          mkdir -p build-fonts voice
          G=https://raw.githubusercontent.com/google/fonts/main/ofl
          for f in instrumentserif/InstrumentSerif-Regular.ttf instrumentserif/InstrumentSerif-Italic.ttf \
                   ibmplexmono/IBMPlexMono-Regular.ttf ibmplexmono/IBMPlexMono-Medium.ttf; do
            curl -fsSL --retry 3 -o "build-fonts/$(basename $f)" "$G/$f" || echo "::warning::font $f unavailable; using a fallback"
          done
          V=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high
          curl -fsSL --retry 3 -o voice/en_US-ryan-high.onnx "$V/en_US-ryan-high.onnx"
          curl -fsSL --retry 3 -o voice/en_US-ryan-high.onnx.json "$V/en_US-ryan-high.onnx.json"
          test "$(stat -c%s voice/en_US-ryan-high.onnx)" -gt 10000000

      - name: Build the video
        env:
          PIPER_VOICE: voice/en_US-ryan-high.onnx
          FONT_DIR: build-fonts
        run: |
          set -eo pipefail
          python3 scripts/top5_video.py build --root snap --out build
          python3 -c "import json; m=json.load(open('build/meta.json')); assert m['narrated'], 'built without narration'; assert m['duration_seconds'] > 60, 'too short'; assert m['as_of']=='${{ inputs.date }}', 'wrong date: '+m['as_of']"
          MEAN=$(ffmpeg -hide_banner -nostats -i build/briefing.mp4 -vn -af volumedetect -f null - 2>&1 | sed -n 's/.*mean_volume: \(-\?[0-9.]*\) dB.*/\1/p')
          echo "Sound level: ${MEAN} dB" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -c "import sys; m=float('${MEAN:--99}'); sys.exit(0 if m > -40 else 'silent video (mean %.1f dB); not uploading' % m)"
          python3 -c "import json; m=json.load(open('build/meta.json')); print('## ' + m['title']); print(); print('Length ' + m['duration'])" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.date }}-backfill
          path: |
            build/briefing.mp4
            build/briefing.srt
            build/thumbnail.png
            build/title.txt
            build/description.txt
          retention-days: 14

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.privacy }}
        run: |
          python3 scripts/top5_video.py publish --build build
          python3 -c "import json; p=json.load(open('build/published.json')); print('YouTube: https://youtu.be/%s (%s)' % (p['video_id'], 'public' if p['visible'] else 'held private by YouTube'))" >> "$GITHUB_STEP_SUMMARY"

      - name: Add it to that night's note
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import top5_video as tv
          pub = json.load(open("build/published.json"))
          if not pub.get("visible"):
              print("::warning::YouTube is keeping the video private, so the note is left alone. Make it public in YouTube Studio, then add it from the control room.")
              sys.exit(0)
          page = Path(f"top-five-{pub['date']}.html")
          txt = page.read_text(encoding="utf-8")
          if tv.FIG_RE.search(txt) or 'class="t5-video"' in txt:
              print("the note already has a video; left alone"); sys.exit(0)
          if '<div class="prose">' not in txt or 'id="note-video-css"' not in txt:
              print("::warning::the note isn't in the expected layout; add the video from the control room"); sys.exit(0)
          at = txt.index('<div class="prose">') + len('<div class="prose">')
          page.write_text(txt[:at] + "\n\n" + tv.note_figure(pub["video_id"], pub["duration"]) + txt[at:].lstrip("\n"), encoding="utf-8")
          print("added to", page.name)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "top-five-${{ inputs.date }}.html"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Video for the ${{ inputs.date }} note"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && { echo "Added to https://thevancereport.com/top-five-${{ inputs.date }}.html" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep 10
          done
          echo "::error::couldn't push after three tries"; exit 1

name: Daily video

# Builds tonight's top-five video straight after the daily screen publishes,
# narrates it with the free piper voice, uploads it to YouTube and puts it on
# the site. Everything it says comes from value_screen.json.
#
# The screen's schedule is a ladder of up to five runs a night, and every run
# that stops early still "succeeds". So this job checks for itself that the
# screen file is new, and that tonight's video has not already been made.
#
# YouTube: set the repository secrets YT_CLIENT_ID, YT_CLIENT_SECRET and
# YT_REFRESH_TOKEN (VIDEO_SETUP.md). Without them the video is still built and
# attached to the run, just not uploaded. Privacy comes from the repository
# variable YT_PRIVACY (public unless set).
#
# The previous briefing job (research.json, retired screen) is replaced by
# this one; its scripts stay in scripts/ for reference.

on:
  workflow_run:
    workflows: ["Daily value screen"]
    types: [completed]
  workflow_dispatch:
    inputs:
      privacy:
        description: "YouTube privacy for this run"
        type: choice
        default: public
        options: [public, unlisted, private]
      force:
        description: "Make it again even if tonight's video exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  video:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Is there a new screen without a video?
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          python3 - <<'PY'
          import json, os, datetime as dt
          m = json.load(open("value_screen.json"))["_meta"]
          as_of, gen = m["as_of"], m.get("generated_at", "")
          age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(gen.replace("Z", "+00:00"))).total_seconds() / 3600 if gen else 999
          done = ""
          if os.path.exists("daily_video.json"):
              done = json.load(open("daily_video.json")).get("date", "")
          force = os.environ.get("FORCE") == "true"
          go = force or (done != as_of and age < 20)
          why = ("forced" if force else "tonight's video already exists" if done == as_of
                 else f"screen file is {age:.0f}h old" if age >= 20 else "new screen")
          print(f"screen {as_of}, generated {age:.1f}h ago, last video {done or 'none'}: {why}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"go={'yes' if go else 'no'}\nas_of={as_of}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"Screen {as_of}: {'building the video' if go else 'nothing to do'} ({why}).\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.check.outputs.go == 'yes'
        with:
          python-version: "3.11"

      - name: Install ffmpeg, fonts and the voice
        if: steps.check.outputs.go == 'yes'
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet pillow numpy requests piper-tts
          mkdir -p build-fonts voice
          G=https://raw.githubusercontent.com/google/fonts/main/ofl
          for f in instrumentserif/InstrumentSerif-Regular.ttf instrumentserif/InstrumentSerif-Italic.ttf \
                   ibmplexmono/IBMPlexMono-Regular.ttf ibmplexmono/IBMPlexMono-Medium.ttf; do
            curl -fsSL --retry 3 -o "build-fonts/$(basename $f)" "$G/$f" || echo "::warning::font $f unavailable; using a fallback"
          done
          V=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high
          curl -fsSL --retry 3 -o voice/en_US-ryan-high.onnx "$V/en_US-ryan-high.onnx"
          curl -fsSL --retry 3 -o voice/en_US-ryan-high.onnx.json "$V/en_US-ryan-high.onnx.json"
          # a truncated model speaks silence rather than failing, so check its size
          test "$(stat -c%s voice/en_US-ryan-high.onnx)" -gt 10000000

      - name: Build the video
        if: steps.check.outputs.go == 'yes'
        env:
          PIPER_VOICE: voice/en_US-ryan-high.onnx
          FONT_DIR: build-fonts
        run: |
          set -eo pipefail
          python3 scripts/top5_video.py build --out build
          python3 -c "import json; m=json.load(open('build/meta.json')); assert m['narrated'], 'built without narration'; assert m['duration_seconds'] > 60, 'too short'"
          # Hear it, don't just trust it: a silent voice file would still count as "narrated".
          MEAN=$(ffmpeg -hide_banner -nostats -i build/briefing.mp4 -vn -af volumedetect -f null - 2>&1 | sed -n 's/.*mean_volume: \(-\?[0-9.]*\) dB.*/\1/p')
          echo "Sound level: ${MEAN} dB (speech is usually -30 to -15)" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -c "import sys; m=float('${MEAN:--99}'); sys.exit(0 if m > -40 else 'the video is silent or nearly silent (mean %.1f dB); not uploading' % m)"
          python3 -c "import json; m=json.load(open('build/meta.json')); print('## ' + m['title']); print(); print('Length ' + m['duration'])" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.go == 'yes'
        with:
          name: video-${{ steps.check.outputs.as_of }}
          path: |
            build/briefing.mp4
            build/briefing.srt
            build/thumbnail.png
            build/title.txt
            build/description.txt
          retention-days: 14

      - name: Upload to YouTube
        if: steps.check.outputs.go == 'yes'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.privacy || vars.YT_PRIVACY || 'public' }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::notice::YouTube isn't connected yet, so the video was built but not uploaded. Download it from this run's Artifacts. VIDEO_SETUP.md explains the one-time setup."
            echo "YouTube not connected: download the video from **Artifacts** below." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/top5_video.py publish --build build
          python3 -c "import json; p=json.load(open('build/published.json')); print('YouTube: https://youtu.be/%s (%s)' % (p['video_id'], 'on the site' if p['visible'] else 'held private by YouTube, so not on the site'))" >> "$GITHUB_STEP_SUMMARY"

      - name: Put it on the site
        if: steps.check.outputs.go == 'yes'
        run: |
          set -eo pipefail
          python3 scripts/top5_video.py site --build build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- daily_video.json top5.json top-five-*.html 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Daily video for ${{ steps.check.outputs.as_of }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error::couldn't push after three tries"; exit 1

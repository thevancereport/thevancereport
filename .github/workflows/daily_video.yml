name: Daily briefing video

# Runs after the screener has written research.json. Building a video from a
# stale screen is worse than not publishing one, so this job reads the file
# from the repo rather than regenerating it, and stops if it is not from today.

# PAUSED 20 September 2026. The briefing is built from research.json, which
# describes the retired cash-plus-drop screen, not the ranking the site runs
# now. Left on, it would post a retired-screen briefing to the channel after
# every data sync and overwrite video.json with it. The automatic trigger is
# removed rather than the file, so the pipeline and its history stay intact
# for the rebuild on the current screen's vocabulary (issues #26 and #31).
# It can still be run by hand from the Actions tab.
#
# To restore:  put these three lines back under "on:"
#   workflow_run:
#     workflows: ["Daily Financial Data Sync"]
#     types: [completed]
on:
  workflow_dispatch:
    inputs:
      privacy:
        description: "YouTube privacy for this run"
        type: choice
        default: private
        options: [private, unlisted, public]
      allow_stale:
        description: "Build even if research.json is not from today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  build-and-publish:
    # Skip when the screener failed: no point narrating yesterday's numbers.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check research.json is current
        id: freshness
        run: |
          set -euo pipefail
          GEN=$(python3 -c "import json;print(json.load(open('research.json'))['_meta']['generated_at'])")
          echo "generated_at=$GEN"
          python3 - "$GEN" <<'PY'
          import sys, datetime
          gen = datetime.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          age = (datetime.datetime.now(datetime.timezone.utc) - gen).total_seconds() / 3600
          print(f"research.json is {age:.1f}h old")
          open("AGE", "w").write(f"{age:.1f}")
          PY
          AGE=$(cat AGE)
          STALE=$(python3 -c "print('yes' if float('$AGE') > 26 else 'no')")
          echo "stale=$STALE" >> "$GITHUB_OUTPUT"

      - name: Stop on stale data
        if: steps.freshness.outputs.stale == 'yes' && inputs.allow_stale != true
        run: |
          echo "::warning::research.json is more than 26h old - not publishing a briefing."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The runner already ships Chrome, so do not apt-install a browser:
      # on Ubuntu 24.04 `chromium-browser` is a snap shim that fails in CI.
      # Only ffmpeg and the typefaces are actually needed, and a missing
      # typeface is a cosmetic problem, not a reason to abandon the run.
      - name: Install ffmpeg and the site's typefaces
        id: deps
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          sudo apt-get install -y -qq fonts-ibm-plex \
            || echo "::warning::fonts-ibm-plex unavailable; slides fall back to DejaVu"
          fc-cache -f >/dev/null 2>&1 || true
          pip install --quiet requests

          BROWSER=""
          for c in "$(command -v google-chrome || true)" \
                   "$(command -v google-chrome-stable || true)" \
                   "$(command -v chromium || true)" \
                   "$(command -v chromium-browser || true)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then BROWSER="$c"; break; fi
          done
          if [ -z "$BROWSER" ]; then
            sudo apt-get install -y -qq chromium
            BROWSER="$(command -v chromium)"
          fi
          echo "using browser: $BROWSER"
          "$BROWSER" --version || true
          echo "browser=$BROWSER" >> "$GITHUB_OUTPUT"

      - name: Install piper and the narration voice
        run: |
          set -eo pipefail
          pip install --quiet piper-tts
          mkdir -p voice
          BASE=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high
          curl -fsSL --retry 3 -o voice/en_US-ryan-high.onnx      "$BASE/en_US-ryan-high.onnx"
          curl -fsSL --retry 3 -o voice/en_US-ryan-high.onnx.json "$BASE/en_US-ryan-high.onnx.json"
          ls -la voice
          # A truncated model produces silence rather than an error, so check.
          test "$(stat -c%s voice/en_US-ryan-high.onnx)" -gt 10000000

      - name: Build the video
        env:
          PIPER_VOICE: voice/en_US-ryan-high.onnx
          CHROMIUM_PATH: ${{ steps.deps.outputs.browser }}
        run: |
          set -eo pipefail
          python3 scripts/build_video.py --out build
          python3 - <<'PY'
          import json
          m = json.load(open("build/meta.json"))
          print(m)
          assert m["narrated"], "built without narration - refusing to publish"
          assert m["duration_seconds"] > 30, "suspiciously short build"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ github.run_number }}
          path: |
            build/briefing.mp4
            build/briefing.srt
            build/description.txt
          retention-days: 14

      # Not-yet-configured and broken are different states and should look
      # different. With no secrets at all the run stays green and says so --
      # the video is still attached above. With secrets present, a failed
      # upload fails the run.
      - name: Upload to YouTube
        id: publish
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.privacy || vars.YT_PRIVACY || 'private' }}
        run: |
          if [ -z "${YT_REFRESH_TOKEN}" ]; then
            echo "::warning::No YouTube credentials configured - built the video but did not publish it. Download it from this run's artifacts; see VIDEO_SETUP.md."
            echo "published=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/upload_youtube.py --build build --out video.json
          echo "published=yes" >> "$GITHUB_OUTPUT"

      # The link-preview card is rebuilt every run and names today's tickers,
      # so it is committed whether or not the video was published.
      - name: Commit video.json and the social card
        run: |
          set -eo pipefail
          cp -f build/og-card.png og-card.png 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- og-card.png 2>/dev/null || true
          if [ "${{ steps.publish.outputs.published }}" = "yes" ]; then
            git add -- video.json
          fi
          if git diff --cached --quiet; then
            echo "nothing changed"; exit 0
          fi
          STAMP=$(python3 -c "import json;print(json.load(open('build/meta.json'))['run_date'])")
          git commit -m "Daily briefing $STAMP [skip ci]"
          git push

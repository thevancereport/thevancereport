name: Premise check (one-off study)

# Not part of the daily pipeline and not on a schedule. It answers one
# question -- did the names this screen picks beat the market over three and
# six months -- and it writes nothing to the site. Run it from the Actions tab
# when you want the answer, read the summary at the end of the log, and
# download the JSON if you want the individual picks.

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: "How many eligible symbols to study (more = slower, tighter error bars)"
        default: "500"
      sample_seed:
        description: "Sample seed; change it to check the answer is not an artefact of one draw"
        default: "20260919"

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run the study
        env:
          SAMPLE_SIZE: ${{ inputs.sample_size }}
          SAMPLE_SEED: ${{ inputs.sample_seed }}
        run: python scripts/premise_check.py

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premise-check
          path: premise_check.json
          if-no-files-found: warn

name: Daily value screen

# Ranks the eligible universe with the rules frozen in scripts/VALUE_SPEC.md and
# commits value_screen.json, which every page on the site reads.
#
# It runs the offline tests first. A broken percentile costs ten seconds to find
# here and a day of wrong numbers on the site if it is not found at all.
#
# The job never commits a thin file: value_daily.py refuses to write anything if
# fewer than 200 price histories or fewer than 50 eligible companies come back,
# so a bad data day leaves yesterday's file in place rather than replacing it
# with a short one.

on:
  schedule:
    # 02:15 UTC Tuesday-Saturday = 9:15 PM Central / 10:15 PM Eastern, with a
    # second attempt at 03:45 UTC. On 22 Sep 2026 the 00:15 slot found that
    # only 2,236 of 3,087 names carried the day's close in Nasdaq's historical
    # table an hour after the bell; the quote top-up is all-or-nothing, so the
    # run correctly refused to publish and the site kept Monday's screen. The
    # data fills in through the evening, so the job now starts later and tries
    # again if the first attempt refuses. A second run on a day that already
    # published is harmless: value_daily.py refuses to write a session that is
    # not newer than the file's own prices_through.
    #
    # The original note on why it cannot run before 8 PM Eastern still holds:
    # Monday-Friday evenings. It has to be after 8 PM Eastern: that is when
    # Nasdaq's quote marks the market Closed, and the run takes each session's
    # official close from that quote because Nasdaq's historical table does
    # not carry the day until much later (see value_prices.latest_close). The
    # 22:10 UTC slot this replaces ran before either had the close, and on
    # 21 Sep 2026 published Friday's prices under Monday's date.
    - cron: '15 2 * * 2-6'
    - cron: '45 3 * * 2-6'
  workflow_dispatch:
    inputs:
      as_of:
        description: "Rank as of this date (YYYY-MM-DD, blank = today)"
        default: ""
      max_symbols:
        description: "Cap the symbol count for a smoke run (0 = no cap)"
        default: "0"
      commit:
        description: "true = commit value_screen.json, false = build it and stop"
        default: "true"

permissions:
  contents: write

concurrency:
  group: value-daily
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the maths before spending an hour on it
        working-directory: scripts
        env:
          # test_end_to_end.py runs a full synthetic backtest, and the summary
          # writer fires inside it. Left alone it prints 54 rebalances over an
          # invented 240-company universe into the job summary, directly above
          # the real result, where it reads exactly like a real result. Blank
          # here means the writer sees no path and skips.
          GITHUB_STEP_SUMMARY: ""
        run: |
          python test_value_core.py
          python test_value_data.py
          python test_value_daily.py
          python test_screen_history.py

      - name: Rank today's universe
        working-directory: scripts
        env:
          AS_OF: ${{ inputs.as_of }}
          MAX_SYMBOLS: ${{ inputs.max_symbols || '0' }}
          OUT_FILE: ${{ github.workspace }}/value_screen.json
          SEC_UA: "TheVanceReport research contact@thevancereport.com"
        run: python value_daily.py

      - name: Record the session in screen_history.json
        env:
          SCREEN_FILE: ${{ github.workspace }}/value_screen.json
          HISTORY_FILE: ${{ github.workspace }}/screen_history.json
        working-directory: scripts
        run: python screen_history.py

      - name: Keep a copy whatever happens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-screen
          path: value_screen.json
          if-no-files-found: warn

      - name: Commit it
        if: ${{ inputs.commit != 'false' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # No [skip ci]. Netlify honours that marker and will not build, so the
          # new file would sit in the repository and never reach the site --
          # which is exactly what happens to research.json on any day nobody
          # merges anything else.
          commit_message: "Daily value screen"
          file_pattern: "value_screen.json screen_history.json"

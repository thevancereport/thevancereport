<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Breakdown - The Vance Report</title>
  <style>
    :root {
      --bg: #0c1014;
      --card-bg: #12181e;
      --text: #e7e3d8;
      --amber: #e0a33c;
      --mono: monospace;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .header {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back-btn {
      color: var(--amber);
      text-decoration: none;
      font-family: var(--mono);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 20px;
    }
    #tradingview_chart {
      height: 500px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="back-btn">&larr; BACK TO SCREENER</a>
    <h1 id="ticker-title" style="color: var(--amber); margin: 0;">--</h1>
  </div>

  <div class="container">
    <div class="card">
      <div id="tradingview_chart"></div>
    </div>
    
    <div class="card" id="research-notes">
      <h3>THESIS & BALANCE SHEET NOTES</h3>
      <p id="notes-content">Loading research data...</p>
    </div>
  </div>

  <!-- TradingView Widget Script -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const symbol = urlParams.get('symbol') || 'SEDG';
    document.getElementById('ticker-title').innerText = symbol + ' PROFILE';

    // Embed TradingView Chart
    new TradingView.widget({
      "width": "100%",
      "height": 500,
      "symbol": symbol,
      "interval": "D",
      "timezone": "Etc/UTC",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "toolbar_bg": "#f1f3f6",
      "enable_publishing": false,
      "allow_symbol_change": true,
      "container_id": "tradingview_chart"
    });

    // Fetch research notes from research.json
    fetch('research.json')
      .then(res => res.json())
      .then(data => {
        if (data[symbol]) {
          document.getElementById('notes-content').innerHTML = `
            <strong>CPS Cushion:</strong> ${data[symbol].cps || 'N/A'}<br/>
            <strong>Catalyst:</strong> ${data[symbol].catalyst || 'N/A'}<br/>
            <strong>Notes:</strong> ${data[symbol].notes || 'No notes available.'}
          `;
        } else {
          document.getElementById('notes-content').innerText = 'No specific setup data recorded in research.json for this symbol.';
        }
      })
      .catch(() => {
        document.getElementById('notes-content').innerText = 'Unable to load research.json.';
      });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <title>Reviews Admin | The Vance Report</title>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { background: #0c1014; color: #e7e3d8; font-family: ui-monospace, monospace; font-size: 16px; padding: 30px; max-width: 900px; margin: 0 auto; }
      h1 { font-size: 20px; }
      input[type="password"] { background: #12181e; border: 1px solid #26303a; color: #e7e3d8; padding: 10px; font-family: inherit; width: 320px; }
      button { background: #e0a33c; border: 0; color: #0c1014; padding: 10px 18px; cursor: pointer; font-weight: 600; margin-left: 8px; }
      .row { border: 1px solid #26303a; background: #12181e; padding: 16px; margin-bottom: 12px; }
      .needs { color: #cc6250; }
      .good { color: #61a887; }
      .meta { color: #6f7680; font-size: 13.5px; margin-top: 8px; }
      .note { margin: 4px 0 0 16px; font-size: 14px; color: #a8a79f; }
      .comment { margin-top: 10px; font-style: italic; color: #e7e3d8; }
      .error { color: #cc6250; }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <h1>Reviews Admin</h1>
    <p>Key is only used for this session's requests — never saved anywhere.</p>
    <div>
      <input type="password" id="keyInput" placeholder="ADMIN_REVIEW_KEY">
      <button id="loadBtn">Load reviews</button>
    </div>
    <div id="output" style="margin-top: 24px;"></div>

    <script>
      var LABELS = {
        data_freshness: "Daily Data Freshness",
        screen_filters: "Custom Screen Engine",
        site_layout: "Site Layout & Navigation",
        visual_design: "Visual Design",
        info_quality: "Quality of Information",
      };

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      document.getElementById("loadBtn").addEventListener("click", function () {
        var key = document.getElementById("keyInput").value;
        var output = document.getElementById("output");
        output.innerHTML = "Loading...";

        fetch("/api/reviews?view=dashboard", { headers: { "x-admin-key": key } })
          .then(function (res) {
            if (!res.ok) throw new Error(res.status === 401 ? "Wrong key." : "HTTP " + res.status);
            return res.json();
          })
          .then(function (data) {
            var reviews = data.reviews || [];
            if (!reviews.length) {
              output.innerHTML = "<p>No reviews yet.</p>";
              return;
            }
            output.innerHTML = reviews.map(function (r) {
              var notes = Object.keys(LABELS).map(function (key) {
                if (r[key] === "needs_work") {
                  return '<div class="note needs">\u2716 ' + LABELS[key] + ': ' + esc(r[key + "_note"]) + '</div>';
                }
                return '<div class="note good">\u2713 ' + LABELS[key] + '</div>';
              }).join("");
              return (
                '<div class="row">' +
                  notes +
                  '<div class="comment">\u201c' + esc(r.comment) + '\u201d</div>' +
                  '<div class="meta">Score ' + r.positive_score + '/5 \u00b7 ' + new Date(r.created_at).toLocaleString() + '</div>' +
                '</div>'
              );
            }).join("");
          })
          .catch(function (err) {
            output.innerHTML = '<p class="error">' + esc(err.message) + '</p>';
          });
      });
    </script>
  </body>
</html>
